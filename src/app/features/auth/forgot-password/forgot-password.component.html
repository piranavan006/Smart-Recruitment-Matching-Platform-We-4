<div class="forgot-password-page">

  <div class="forgot-password-card">

    <h1>Forgot Password?</h1>

    <p>
      Enter your email address and we'll help you reset your password.
    </p>


    <form
      #forgotForm="ngForm"
      (ngSubmit)="onSubmit(forgotForm)"
      novalidate>


      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          [(ngModel)]="email"
          #emailField="ngModel"
          required
          email
          [class.input-error]="
            emailField.invalid &&
            (emailField.touched || forgotForm.submitted)
          "
        />


        <!-- Required Validation -->
        <small
          class="field-error"
          *ngIf="
            emailField.invalid &&
            (emailField.touched || forgotForm.submitted)
          ">

          <span *ngIf="emailField.errors?.['required']">
            Email address is required.
          </span>

          <span *ngIf="emailField.errors?.['email']">
            Please enter a valid email address.
          </span>

        </small>

      </div>


      <!-- Error -->
      <div
        class="error-message"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </div>


      <!-- Success -->
      <div
        class="success-message"
        *ngIf="successMessage">

        {{ successMessage }}

      </div>


      <!-- Send OTP -->
      <button
        type="submit"
        [disabled]="forgotForm.invalid || isLoading">

        {{ isLoading ? 'Sending OTP...' : 'Send OTP' }}

      </button>

    </form>


    <!-- Back to Login -->
    <div class="back-login">

      <a routerLink="/login">
        ← Back to Login
      </a>

    </div>

  </div>

</div>
