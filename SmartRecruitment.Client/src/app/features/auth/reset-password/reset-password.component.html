<div class="reset-password-page">

  <div class="reset-password-card">

    <h1>Reset Password</h1>

    <p>
      Create a new password for your account.
    </p>

    <form
      #resetForm="ngForm"
      (ngSubmit)="onSubmit(resetForm)"
    >

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          [(ngModel)]="email"
          required
          email
        />

      </div>


      <!-- New Password -->
      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <input
          type="password"
          id="newPassword"
          name="newPassword"
          placeholder="Enter your new password"
          [(ngModel)]="newPassword"
          required
          minlength="6"
        />

      </div>


      <!-- Confirm Password -->
      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your new password"
          [(ngModel)]="confirmPassword"
          required
          minlength="6"
        />

      </div>


      <!-- Error -->
      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <!-- Success -->
      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>


      <!-- Reset Button -->
      <button
        type="submit"
        [disabled]="resetForm.invalid || isLoading"
      >
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>


    <!-- Back to Login -->
    <div class="back-login">

      <a routerLink="/login">
        ← Back to Login
      </a>

    </div>

  </div>

</div>
