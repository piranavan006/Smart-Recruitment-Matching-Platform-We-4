<div class="verify-otp-page">

  <div class="verify-otp-card">

    <h1>Verify OTP</h1>

    <p>
      Enter the OTP sent to your email address to continue.
    </p>

    <form #otpForm="ngForm" (ngSubmit)="onSubmit(otpForm)">

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          [(ngModel)]="email"
          required
          email
        />

      </div>

      <!-- OTP -->
      <div class="form-group">

        <label for="otp">
          OTP Code
        </label>

        <input
          type="text"
          id="otp"
          name="otp"
          placeholder="Enter 6-digit OTP"
          [(ngModel)]="otp"
          required
          minlength="6"
          maxlength="6"
          pattern="[0-9]{6}"
        />

      </div>

      <!-- Error -->
      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <!-- Success -->
      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>

      <!-- Verify Button -->
      <button
        type="submit"
        [disabled]="otpForm.invalid || isLoading"
      >
        {{ isLoading ? 'Verifying...' : 'Verify OTP' }}
      </button>

    </form>

    <!-- Back -->
    <div class="back-login">

      <a routerLink="/forgot-password">
        ← Back to Forgot Password
      </a>

    </div>

  </div>

</div>
